<!DOCTYPE html>
<html>
<head>
    <title>Test Netlify Function</title>
</head>
<body>
    <h1>Test Netlify Function</h1>
    <button onclick="testFunction()">Test Function</button>
    <div id="result"></div>

    <script>
        async function testFunction() {
            try {
                const response = await fetch('/.netlify/functions/fortune', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        cards: 'The Fool, The Magician, The High Priestess',
                        astroSign: 'Aries',
                        language: 'en'
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    '<h3>Response:</h3><p>' + data.fortune + '</p>';
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<h3>Error:</h3><p>' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
